<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" role="img" aria-labelledby="t d">
<title id="t">Lockstep PP (schematic)</title>
<desc id="d">A lockstep pipeline of 4 stages and 5 micro-batches: every beat all stages meet once on the host, so the beat is the slowest micro-batch in flight plus the rendezvous.</desc>
