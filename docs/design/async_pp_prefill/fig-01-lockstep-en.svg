<text x="32.0" y="40.0" class="ink" font-size="22" text-anchor="start" font-weight="650">Lockstep PP: every beat, all stages meet once (schematic)</text>
<text x="32.0" y="68.0" class="ink2" font-size="15" text-anchor="start" font-weight="400">Stage costs are within 3% of each other, yet the beat = the slowest micro-batch in flight + host rendezvous, and every stage loses time</text>
