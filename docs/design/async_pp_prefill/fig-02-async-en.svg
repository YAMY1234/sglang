<text x="32.0" y="40.0" class="ink" font-size="22" text-anchor="start" font-weight="650">Fully asynchronous PP: a stage starts as soon as its two inputs are ready (schematic)</text>
<text x="32.0" y="68.0" class="ink2" font-size="15" text-anchor="start" font-weight="400">Batch content: decided by PP0, identical on every stage. When to start: each stage decides. With similar stage costs, every stage keeps</text>
<text x="32.0" y="90.0" class="ink2" font-size="15" text-anchor="start" font-weight="400">only a small gap.</text>
