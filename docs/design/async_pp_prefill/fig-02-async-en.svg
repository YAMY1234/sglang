<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" role="img" aria-labelledby="t d">
<title id="t">Fully asynchronous PP (schematic)</title>
<desc id="d">The same 4 stages and 5 micro-batches without a rendezvous: each stage starts once the upstream activations and its own prefix KV are ready, so the beat is the slowest stage's own forward.</desc>
