<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 706" width="1240" height="706" role="img" aria-labelledby="t d">
<title id="t">Host round vs forward</title>
<desc id="d">One stage, two consecutive micro-batches: long vs short forward.</desc>
<style>
