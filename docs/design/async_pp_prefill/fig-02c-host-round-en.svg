<rect x="0" y="0" width="1240" height="706" class="bg"/>
<text x="32.0" y="40.0" class="ink" font-size="22" text-anchor="start" font-weight="650">One stage, two micro-batches: when the host round stops fitting under the forward</text>
<text x="32.0" y="66.0" class="ink2" font-size="14" text-anchor="start" font-weight="400">Host rounds are drawn to scale from the measured per-round breakdown (PP1–PP7 mean, two 8-node test benches). Long forward: the CPU work is about 65</text>
<text x="32.0" y="85.0" class="ink2" font-size="14" text-anchor="start" font-weight="400">ms of a 170 ms forward and the host runs ahead. Short forward (about 59 ms): one host round takes about 130 ms and the GPU waits for it.</text>
<rect x="24.0" y="110.0" width="1192.0" height="232.0" rx="6" class="panel"/>
<text x="32.0" y="132.0" class="ink" font-size="15" text-anchor="start" font-weight="600">A. Long forward (≈170 ms): host round ≈ 171 ms, CPU ≈ 65 ms; the host is about 1.7 forwards ahead, GPU busy</text>
<text x="162.0" y="225.0" class="muted" font-size="12.6" text-anchor="end" font-weight="400">host</text>
<text x="162.0" y="276.0" class="muted" font-size="12.6" text-anchor="end" font-weight="400">GPU</text>
<rect x="291.3" y="256.0" width="490.1" height="30.0" rx="5" class="b1 bstroke"/>
<text x="536.9" y="275.0" class="btext" font-size="13.8" text-anchor="middle" font-weight="500">forward j</text>
<rect x="783.9" y="256.0" width="425.1" height="30.0" rx="5" class="b2 bstroke"/>
<text x="996.9" y="275.0" class="btext" font-size="13.8" text-anchor="middle" font-weight="500">forward j+1</text>
<rect x="170.0" y="212.0" width="112.9" height="18.0" rx="2" class="hcpu"/>
<text x="226.8" y="225.5" class="ink" font-size="12.6" text-anchor="middle" font-weight="400">launch j+1 (CPU)</text>
<rect x="283.5" y="212.0" width="124.5" height="18.0" rx="2" class="hgpu"/>
<text x="346.1" y="225.5" class="ink" font-size="12.6" text-anchor="middle" font-weight="400">launch queue full</text>
<rect x="408.6" y="212.0" width="19.9" height="18.0" rx="2" class="hcpu"/>
<rect x="429.1" y="212.0" width="25.7" height="18.0" rx="2" class="hpeer"/>
<rect x="455.4" y="212.0" width="1.1" height="18.0" rx="2" class="hpeer"/>
<rect x="457.2" y="212.0" width="13.8" height="18.0" rx="2" class="hcpu"/>
<rect x="471.6" y="212.0" width="78.6" height="18.0" rx="2" class="hgpu"/>
<text x="511.2" y="225.5" class="ink" font-size="12.6" text-anchor="middle" font-weight="400">own load-back</text>
<rect x="550.8" y="212.0" width="5.8" height="18.0" rx="2" class="hcpu"/>
<rect x="557.1" y="212.0" width="45.0" height="18.0" rx="2" class="hcpu"/>
<text x="579.9" y="208.0" class="ink2" font-size="12.1" text-anchor="middle" font-weight="400">admit j+2</text>
<rect x="602.8" y="212.0" width="60.6" height="18.0" rx="2" class="hpeer"/>
<text x="633.4" y="208.0" class="ink2" font-size="12.1" text-anchor="middle" font-weight="400">send credit</text>
<line x1="664.0" y1="204.0" x2="664.0" y2="294.0" class="ref"/>
<text x="668.0" y="192.0" class="ink2" font-size="12.6" text-anchor="start" font-weight="400">launch j+2 (one round = 171 ms)</text>
<rect x="664.0" y="212.0" width="112.9" height="18.0" rx="2" class="hcpu"/>
<rect x="777.5" y="212.0" width="124.5" height="18.0" rx="2" class="hgpu"/>
<rect x="902.6" y="212.0" width="19.9" height="18.0" rx="2" class="hcpu"/>
<rect x="923.1" y="212.0" width="25.7" height="18.0" rx="2" class="hpeer"/>
<rect x="949.4" y="212.0" width="1.1" height="18.0" rx="2" class="hpeer"/>
<rect x="951.2" y="212.0" width="13.8" height="18.0" rx="2" class="hcpu"/>
<rect x="965.6" y="212.0" width="78.6" height="18.0" rx="2" class="hgpu"/>
<rect x="1044.8" y="212.0" width="5.8" height="18.0" rx="2" class="hcpu"/>
<rect x="1051.1" y="212.0" width="45.0" height="18.0" rx="2" class="hcpu"/>
<rect x="1096.8" y="212.0" width="60.6" height="18.0" rx="2" class="hpeer"/>
<rect x="1158.0" y="212.0" width="51.4" height="18.0" rx="2" class="hcpu"/>
<line x1="170.0" y1="204.0" x2="170.0" y2="232.0" class="ref"/>
<text x="170.0" y="308.0" class="ink2" font-size="13.8" text-anchor="start" font-weight="400">Most of the long round is waiting: launch queue full 43 ms, own load-back 27 ms, send credit 21 ms, upstream relay 9 ms. Waiting costs nothing while the GPU has queued work.</text>
<rect x="24.0" y="362.0" width="1192.0" height="232.0" rx="6" class="panel"/>
<text x="32.0" y="384.0" class="ink" font-size="15" text-anchor="start" font-weight="600">B. Short forward (≈59 ms): host round ≈ 130 ms; GPU waits for the host</text>
<text x="162.0" y="477.0" class="muted" font-size="12.6" text-anchor="end" font-weight="400">host</text>
<text x="162.0" y="528.0" class="muted" font-size="12.6" text-anchor="end" font-weight="400">GPU</text>
<rect x="198.9" y="508.0" width="168.9" height="30.0" rx="5" class="b1 bstroke"/>
<text x="283.8" y="527.0" class="btext" font-size="13.8" text-anchor="middle" font-weight="500">forward j</text>
<rect x="368.8" y="508.0" width="204.8" height="30.0" rx="3" class="gapred"/>
<text x="471.2" y="527.0" class="ink" font-size="13.8" text-anchor="middle" font-weight="600">GPU idle ≈ 60–70 ms</text>
<rect x="573.6" y="508.0" width="168.9" height="30.0" rx="5" class="b2 bstroke"/>
<text x="658.5" y="527.0" class="btext" font-size="13.8" text-anchor="middle" font-weight="500">forward j+1</text>
<rect x="194.3" y="464.0" width="134.3" height="18.0" rx="2" class="hcpu"/>
<text x="261.7" y="477.5" class="ink" font-size="12.6" text-anchor="middle" font-weight="400">launch j (CPU)</text>
<rect x="329.2" y="464.0" width="11.2" height="18.0" rx="2" class="hcpu"/>
<rect x="341.0" y="464.0" width="47.4" height="18.0" rx="2" class="hpeer"/>
<text x="365.0" y="460.0" class="ink2" font-size="12.1" text-anchor="middle" font-weight="400">release relay</text>
<rect x="389.0" y="464.0" width="8.4" height="18.0" rx="2" class="hcpu"/>
<rect x="397.9" y="464.0" width="7.8" height="18.0" rx="2" class="hpeer"/>
<rect x="406.3" y="464.0" width="3.2" height="18.0" rx="2" class="hpeer"/>
<rect x="410.1" y="464.0" width="14.1" height="18.0" rx="2" class="hcpu"/>
<rect x="424.8" y="464.0" width="7.5" height="18.0" rx="2" class="hgpu"/>
<rect x="432.9" y="464.0" width="8.1" height="18.0" rx="2" class="hcpu"/>
<rect x="441.6" y="464.0" width="67.6" height="18.0" rx="2" class="hcpu"/>
<text x="475.6" y="477.5" class="ink" font-size="12.6" text-anchor="middle" font-weight="400">admit j+1</text>
<rect x="509.7" y="464.0" width="58.6" height="18.0" rx="2" class="hpeer"/>
<text x="539.3" y="460.0" class="ink2" font-size="12.1" text-anchor="middle" font-weight="400">send credit</text>
<line x1="569.0" y1="456.0" x2="569.0" y2="546.0" class="ref"/>
<text x="573.0" y="444.0" class="ink2" font-size="12.6" text-anchor="start" font-weight="400">launch j+1 (one round = 130 ms)</text>
<rect x="569.0" y="464.0" width="134.3" height="18.0" rx="2" class="hcpu"/>
<rect x="703.9" y="464.0" width="11.2" height="18.0" rx="2" class="hcpu"/>
<rect x="715.7" y="464.0" width="47.4" height="18.0" rx="2" class="hpeer"/>
<rect x="763.7" y="464.0" width="8.4" height="18.0" rx="2" class="hcpu"/>
