<rect x="1190.9" y="464.0" width="18.5" height="18.0" rx="2" class="hcpu"/>
<line x1="194.3" y1="456.0" x2="194.3" y2="484.0" class="ref"/>
<text x="170.0" y="560.0" class="ink2" font-size="13.8" text-anchor="start" font-weight="400">Short-forward runs (KV full): launch CPU 45, admission 24, send credit 21, relay waits 21 (mostly release drain), output 7, build 5, HiCache 3, ack 3 ms per round.</text>
<rect x="32.0" y="628.0" width="16.0" height="14.0" rx="2" class="hcpu"/>
<text x="56.0" y="640.0" class="ink2" font-size="13.8" text-anchor="start" font-weight="400">host CPU work</text>
<rect x="332.0" y="628.0" width="16.0" height="14.0" rx="2" class="hpeer"/>
<text x="356.0" y="640.0" class="ink2" font-size="13.8" text-anchor="start" font-weight="400">host waits: neighbour or send credit</text>
<rect x="632.0" y="628.0" width="16.0" height="14.0" rx="2" class="hgpu"/>
<text x="656.0" y="640.0" class="ink2" font-size="13.8" text-anchor="start" font-weight="400">host waits: own GPU (launch queue, load-back)</text>
<rect x="932.0" y="628.0" width="16.0" height="14.0" rx="2" class="gapred"/>
<text x="956.0" y="640.0" class="ink2" font-size="13.8" text-anchor="start" font-weight="400">GPU idle because the host is late</text>
<text x="32.0" y="674.0" class="muted" font-size="12.6" text-anchor="start" font-weight="400">Measured: per-iteration host-chain diagnostics, iteration-weighted mean over PP1–PP7 (long: all iterations; short: iterations inside runs of short forwards).</text>
<text x="32.0" y="692.0" class="muted" font-size="12.6" text-anchor="start" font-weight="400">Order within a round follows the loop; small items (bootstrap, HiCache host work, post-process) are unlabelled. Forward start after launch is schematic.</text>
</svg>
