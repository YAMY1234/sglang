<rect x="781.0" y="464.0" width="3.2" height="18.0" rx="2" class="hpeer"/>
<rect x="784.8" y="464.0" width="14.1" height="18.0" rx="2" class="hcpu"/>
<rect x="799.5" y="464.0" width="7.5" height="18.0" rx="2" class="hgpu"/>
<rect x="807.6" y="464.0" width="8.1" height="18.0" rx="2" class="hcpu"/>
