<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 468" width="1240" height="468" role="img" aria-labelledby="t d">
<title id="t">Output ring: results travel back to PP0</title>
<desc id="d">Before: PP0's host waits for the last stage's result to come back. Now: each stage completes from its own forward event and the first token goes straight to decode.</desc>
<style>
svg { font-family: system-ui, -apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
.bg { fill: #fcfcfb; }
.ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .muted { fill: #898781; }
.axis { stroke: #c3c2b7; stroke-width: 1; fill: none; }
.grid { stroke: #e1e0d9; stroke-width: 1; fill: none; }
.lane { stroke: #ecebe6; stroke-width: 1; fill: none; }
.b0 { fill: #e6effa; } .b1 { fill: #d6e6f8; } .b2 { fill: #c6dcf5; }
.b3 { fill: #b4d1f2; } .b4 { fill: #a2c5ef; } .b5 { fill: #8fb9ec; }
.bstroke { stroke: #5b8fd0; stroke-width: 1.2; }
.btext { fill: #0b0b0b; }
.bubble { fill: #f3f3f1; stroke: #a8a7a1; stroke-width: 1.2; stroke-dasharray: 6 4; }
.host { fill: #ecebe6; stroke: #b5b3ac; stroke-width: 1; }
.block { fill: #fbe1d6; stroke: #ec835a; stroke-width: 1.2; }
.spinbase { fill: #fdf0d5; stroke: #eda100; stroke-width: 1.2; }
.hatch { stroke: #eda100; stroke-width: 1.4; }
.ce { fill: #d9f2e6; stroke: #1baf7a; stroke-width: 1.2; }
.kv { fill: #6250d6; }
.flag { fill: #1baf7a; }
.handoff { stroke: #2e8b57; stroke-width: 1.8; fill: none; }
.handoffhead { fill: #2e8b57; }
.dep { stroke: #d03b3b; stroke-width: 1.8; fill: none; }
.dephead { fill: #d03b3b; }
.barrier { stroke: #d03b3b; stroke-width: 1.6; }
.ref { stroke: #898781; stroke-width: 1.4; fill: none; }
.refhead { fill: #898781; }
.gray { fill: #a3a29b; } .s1 { fill: #2a78d6; } .s2 { fill: #eb6834; } .s3 { fill: #1baf7a; } .s7 { fill: #6250d6; }
.panel { fill: none; stroke: #e1e0d9; stroke-width: 1; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1a1a19; }
  .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
  .axis { stroke: #383835; } .grid { stroke: #2c2c2a; } .lane { stroke: #262624; }
  .b0 { fill: #1f3550; } .b1 { fill: #23405f; } .b2 { fill: #274b6f; }
  .b3 { fill: #2b567f; } .b4 { fill: #2f6190; } .b5 { fill: #336ca0; }
  .bstroke { stroke: #5598e7; }
  .btext { fill: #f0efec; }
  .bubble { fill: #232322; stroke: #5e5d59; }
  .host { fill: #2c2c2a; stroke: #55544f; }
  .block { fill: #4a2a1f; stroke: #ec835a; }
  .spinbase { fill: #3a2f14; stroke: #c98500; }
  .hatch { stroke: #c98500; }
  .ce { fill: #173b2d; stroke: #199e70; }
  .kv { fill: #9085e9; }
  .flag { fill: #199e70; }
  .handoff { stroke: #3fb56f; } .handoffhead { fill: #3fb56f; }
  .gray { fill: #6f6e68; } .s1 { fill: #3987e5; } .s2 { fill: #d95926; } .s3 { fill: #199e70; } .s7 { fill: #9085e9; }
  .panel { stroke: #2c2c2a; }
}
</style>
<rect x="0" y="0" width="1240" height="468" class="bg"/>
<text x="32.0" y="40.0" class="ink" font-size="22" text-anchor="start" font-weight="650">Output ring: results travel back to PP0</text>
<text x="32.0" y="68.0" class="ink2" font-size="15" text-anchor="start" font-weight="400">PP0 used to wait for the last stage's sampled token before it could finish the micro-batch and free its resources, although in PD</text>
<text x="32.0" y="90.0" class="ink2" font-size="15" text-anchor="start" font-weight="400">prefill the last stage sends the first token to decode anyway.</text>
<text x="40.0" y="136.0" class="ink" font-size="17" text-anchor="start" font-weight="650">Before</text>
<line x1="158.0" y1="197.0" x2="600.0" y2="197.0" class="lane"/>
<text x="40.0" y="179.0" class="ink2" font-size="13" text-anchor="start" font-weight="500">PP0 host</text>
<line x1="158.0" y1="243.0" x2="600.0" y2="243.0" class="lane"/>
<text x="40.0" y="225.0" class="ink2" font-size="13" text-anchor="start" font-weight="500">PP0 GPU</text>
<line x1="158.0" y1="289.0" x2="600.0" y2="289.0" class="lane"/>
<text x="40.0" y="271.0" class="ink2" font-size="13" text-anchor="start" font-weight="500">last stage GPU</text>
<rect x="158.0" y="158.0" width="130.6" height="32.0" rx="6" class="host"></rect>
<text x="223.3" y="178.3" class="ink" font-size="12" text-anchor="middle" font-weight="500">build, launch</text>
<rect x="290.6" y="158.0" width="112.9" height="32.0" rx="6" class="block"></rect>
<rect x="405.5" y="158.0" width="59.9" height="32.0" rx="6" class="host"></rect>
<rect x="467.4" y="158.0" width="130.6" height="32.0" rx="6" class="host"></rect>
<text x="532.7" y="178.3" class="ink" font-size="12" text-anchor="middle" font-weight="500">…</text>
<rect x="158.0" y="204.0" width="139.4" height="32.0" rx="6" class="b1 bstroke"></rect>
<text x="227.7" y="224.3" class="btext" font-size="12" text-anchor="middle" font-weight="500">forward j</text>
<rect x="299.4" y="204.0" width="59.9" height="32.0" rx="6" class="host"></rect>
<rect x="361.3" y="204.0" width="236.7" height="32.0" rx="6" class="b1 bstroke"></rect>
<text x="479.7" y="224.3" class="btext" font-size="12" text-anchor="middle" font-weight="500">forward j+1</text>
<rect x="158.0" y="250.0" width="130.6" height="32.0" rx="6" class="b1 bstroke"></rect>
<text x="223.3" y="270.3" class="btext" font-size="12" text-anchor="middle" font-weight="500">forward j−7</text>
<rect x="290.6" y="250.0" width="307.4" height="32.0" rx="6" class="b1 bstroke"></rect>
<text x="444.3" y="270.3" class="btext" font-size="12" text-anchor="middle" font-weight="500">forward j−6</text>
<line x1="286.2" y1="248.0" x2="308.3" y2="238.0" class="dep"/>
<path d="M308.3,238.0 L298.2,237.6 L301.9,245.8 Z" class="dephead"/>
<line x1="356.9" y1="202.0" x2="396.7" y2="192.0" class="dep"/>
<path d="M396.7,192.0 L386.9,189.8 L389.0,198.6 Z" class="dephead"/>
<text x="40.0" y="310.0" class="ink2" font-size="13" text-anchor="start" font-weight="400">Waits for: the sampled token of the micro-batch 7 slots earlier, back from</text>
<text x="40.0" y="330.0" class="ink2" font-size="13" text-anchor="start" font-weight="400">the last stage</text>
<text x="40.0" y="350.0" class="ink2" font-size="13" text-anchor="start" font-weight="400">If not ready: PP0's host blocks on a D2H event (20–42 s per minute)</text>
<text x="660.0" y="136.0" class="ink" font-size="17" text-anchor="start" font-weight="650">Now</text>
<line x1="778.0" y1="197.0" x2="1220.0" y2="197.0" class="lane"/>
<text x="660.0" y="179.0" class="ink2" font-size="13" text-anchor="start" font-weight="500">PP0 host</text>
<line x1="778.0" y1="243.0" x2="1220.0" y2="243.0" class="lane"/>
<text x="660.0" y="225.0" class="ink2" font-size="13" text-anchor="start" font-weight="500">PP0 GPU</text>
<line x1="778.0" y1="289.0" x2="1220.0" y2="289.0" class="lane"/>
<text x="660.0" y="271.0" class="ink2" font-size="13" text-anchor="start" font-weight="500">last stage GPU</text>
<line x1="778.0" y1="335.0" x2="1220.0" y2="335.0" class="lane"/>
<text x="660.0" y="317.0" class="ink2" font-size="13" text-anchor="start" font-weight="500">decode</text>
<rect x="778.0" y="158.0" width="130.6" height="32.0" rx="6" class="host"></rect>
<text x="843.3" y="178.3" class="ink" font-size="12" text-anchor="middle" font-weight="500">build, launch</text>
<rect x="919.4" y="158.0" width="59.9" height="32.0" rx="6" class="host"></rect>
<rect x="981.3" y="158.0" width="236.7" height="32.0" rx="6" class="host"></rect>
<text x="1099.7" y="178.3" class="ink" font-size="12" text-anchor="middle" font-weight="500">build, launch …</text>
<rect x="778.0" y="204.0" width="139.4" height="32.0" rx="6" class="b1 bstroke"></rect>
<text x="847.7" y="224.3" class="btext" font-size="12" text-anchor="middle" font-weight="500">forward j</text>
<rect x="919.4" y="204.0" width="298.6" height="32.0" rx="6" class="b1 bstroke"></rect>
<text x="1068.7" y="224.3" class="btext" font-size="12" text-anchor="middle" font-weight="500">forward j+1</text>
<rect x="778.0" y="250.0" width="130.6" height="32.0" rx="6" class="b1 bstroke"></rect>
<text x="843.3" y="270.3" class="btext" font-size="12" text-anchor="middle" font-weight="500">forward j−7</text>
<rect x="910.6" y="250.0" width="307.4" height="32.0" rx="6" class="b1 bstroke"></rect>
<text x="1064.3" y="270.3" class="btext" font-size="12" text-anchor="middle" font-weight="500">forward j−6</text>
<rect x="919.4" y="296.0" width="95.2" height="32.0" rx="6" class="host"></rect>
<text x="967.1" y="315.6" class="ink" font-size="10" text-anchor="middle" font-weight="500">recv 1st token</text>
<line x1="915.0" y1="202.0" x2="923.9" y2="192.0" class="handoff"/>
<path d="M923.9,192.0 L914.5,195.8 L921.3,201.7 Z" class="handoffhead"/>
<line x1="906.2" y1="284.0" x2="923.9" y2="294.0" class="handoff"/>
<path d="M923.9,294.0 L918.2,285.7 L913.8,293.5 Z" class="handoffhead"/>
<text x="660.0" y="356.0" class="ink2" font-size="13" text-anchor="start" font-weight="400">Each stage completes the micro-batch from its own forward-done event</text>
<text x="660.0" y="376.0" class="ink2" font-size="13" text-anchor="start" font-weight="400">The last stage sends the first token and draft state straight to decode</text>
<line x1="620.0" y1="122.0" x2="620.0" y2="416.0" class="grid"/>
<rect x="40.0" y="429.0" width="18.0" height="18.0" rx="3" class="b1 bstroke"></rect>
<text x="64.0" y="443.0" class="ink2" font-size="13" text-anchor="start" font-weight="400">compute (forward)</text>
<rect x="214.2" y="429.0" width="18.0" height="18.0" rx="3" class="host"></rect>
<text x="238.2" y="443.0" class="ink2" font-size="13" text-anchor="start" font-weight="400">normal host work</text>
<rect x="380.8" y="429.0" width="18.0" height="18.0" rx="3" class="block"></rect>
<text x="404.8" y="443.0" class="ink2" font-size="13" text-anchor="start" font-weight="400">blocked: host thread stalls</text>
<line x1="630.4" y1="438.0" x2="648.4" y2="438.0" class="handoff"/>
<path d="M648.4,438.0 L639.4,433.5 L639.4,442.5 Z" class="handoffhead"/>
<text x="654.4" y="443.0" class="ink2" font-size="13" text-anchor="start" font-weight="400">data hand-off</text>
<line x1="774.4" y1="438.0" x2="792.4" y2="438.0" class="dep"/>
<path d="M792.4,438.0 L783.4,433.5 L783.4,442.5 Z" class="dephead"/>
<text x="798.4" y="443.0" class="ink2" font-size="13" text-anchor="start" font-weight="400">dependency waited on</text>
</svg>
