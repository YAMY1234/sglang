<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 436" width="1240" height="436" role="img" aria-labelledby="t d">
<title id="t">Resident NCCL kernels stretch the forward</title>
<desc id="d">Before: a resident NCCL recv kernel holds SMs, the cooperative routing kernel queues and the forward stretches. Now: the copy engine copies and the stream waits on a flag, using no SMs.</desc>
<style>
